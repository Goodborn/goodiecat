# Goodiecat starter config. It works as is: a server card, every Docker
# container with a live status dot, and a clock. Change anything you like;
# the dashboard reloads by itself when you save.
#
# More widgets: https://dynacat.artur.zone/configuration

server:
  port: 8080
  # the in-browser editor rewrites this file; only turn it on behind a login
  allow-editing: false

goodiecat:
  # Lets the phone app start, stop and restart containers. The installer
  # puts a random token in the .env file next to docker-compose.yml.
  app-token: ${GOODIECAT_APP_TOKEN}
  docker:
    sock-path: /var/run/docker.sock
  # disks on the server card ("/host" is your computer's main drive)
  host:
    hide-mountpoints-by-default: true
    mountpoints:
      "/host":
        name: System
        hide: false

pages:
  - name: Home
    width: wide
    head-widgets:
      - type: search
        hide-header: true
        search-engine: duckduckgo
      - type: clock
        hide-header: true
        hour-format: 24h

    columns:
      - size: full
        widgets:
          # CPU, memory, disks and temperature
          - type: custom-api
            title: Server
            title-icon: mdi:server
            cache: 10s
            update-interval: 10s
            url: http://localhost:8080/api/goodiecat/host
            headers:
              X-Goodiecat-Token: ${GOODIECAT_APP_TOKEN}
            template: |
              {{ $h := .JSON }}
              {{ $cpu := $h.Int "data.cpu.load1_percent" }}
              {{ $mem := $h.Int "data.memory.used_percent" }}
              <div class="gc-host">
                <span class="gc-dot gc-dot-ok"></span>
                <span class="gc-host-name">{{ $h.String "data.hostname" }}</span>
                <span class="gc-muted">{{ $h.String "data.platform" }}</span>
                <span class="gc-host-up">up <span {{ $h.String "data.boot_time" | parseTime "unix" | toRelativeTime }}></span></span>
              </div>
              <div class="gc-meters">
                <div class="gc-meter{{ if gt $cpu 85 }} gc-meter-bad{{ else if gt $cpu 60 }} gc-meter-warn{{ end }}">
                  <div class="gc-meter-head"><span>CPU</span><b>{{ $cpu }}<small>%</small></b></div>
                  <div class="gc-meter-bar"><div style="width: {{ $cpu }}%"></div></div>
                  <div class="gc-meter-sub">15 min average {{ $h.Int "data.cpu.load15_percent" }}%</div>
                </div>
                <div class="gc-meter{{ if gt $mem 90 }} gc-meter-bad{{ else if gt $mem 75 }} gc-meter-warn{{ end }}">
                  <div class="gc-meter-head"><span>Memory</span><b>{{ $mem }}<small>%</small></b></div>
                  <div class="gc-meter-bar"><div style="width: {{ $mem }}%"></div></div>
                  <div class="gc-meter-sub">{{ formatBytes (mul ($h.Int "data.memory.used_mb") 1048576) }} of {{ formatBytes (mul ($h.Int "data.memory.total_mb") 1048576) }}</div>
                </div>
                {{ range $h.Array "data.mountpoints" }}
                {{ $pct := .Int "used_percent" }}
                <div class="gc-meter{{ if gt $pct 92 }} gc-meter-bad{{ else if gt $pct 80 }} gc-meter-warn{{ end }}">
                  <div class="gc-meter-head"><span>{{ .String "name" }}</span><b>{{ $pct }}<small>%</small></b></div>
                  <div class="gc-meter-bar"><div style="width: {{ $pct }}%"></div></div>
                  <div class="gc-meter-sub">{{ formatBytes (mul (sub (.Int "total_mb") (.Int "used_mb")) 1048576) }} free of {{ formatBytes (mul (.Int "total_mb") 1048576) }}</div>
                </div>
                {{ end }}
                {{ if $h.Bool "data.cpu.temperature_is_available" }}
                {{ $t := $h.Int "data.cpu.temperature_c" }}
                <div class="gc-meter">
                  <div class="gc-meter-head"><span>CPU temp</span><b class="{{ if gt $t 70 }}gc-heat-hot{{ else if gt $t 50 }}gc-heat-warm{{ else }}gc-heat-cool{{ end }}">{{ $t }}<small>°C</small></b></div>
                  <div class="gc-heat"><div style="--p: {{ $t }}"></div></div>
                  <div class="gc-meter-sub">0 – 100 °C scale</div>
                </div>
                {{ end }}
              </div>

          # Every container on this computer, with a green (running) or red
          # (stopped / unhealthy) dot. To give one a nicer name, an icon or a
          # link, add it under `containers:` like the commented example.
          - type: docker-containers
            title: Services
            title-icon: mdi:docker
            sock-path: /var/run/docker.sock
            format-container-names: true
            update-interval: 30s
            # containers:
            #   jellyfin:                     # the container's name
            #     name: Jellyfin
            #     description: Movies and shows
            #     url: http://192.168.1.10:8096
            #     icon: sh:jellyfin

      - size: small
        widgets:
          # WEATHER (the installer fills this in if you give it a city)
          # - type: weather
          #   location: London, United Kingdom
          #   units: metric
          #   hour-format: 24h
          - type: calendar
            first-day-of-week: monday

  # Detail for every container: live CPU and memory, busiest first. Bars
  # compare containers with each other; the numbers are real.
  - name: Services
    width: wide
    columns:
      - size: full
        widgets:
          - type: custom-api
            title: Services
            title-icon: mdi:docker
            cache: 10s
            update-interval: 15s
            url: http://localhost:8080/api/goodiecat/containers/stats
            headers:
              X-Goodiecat-Token: ${GOODIECAT_APP_TOKEN}
            template: |
              <div class="gc-svc">
                {{ range .JSON.Array "data" }}
                {{ $run := eq (.String "state") "running" }}
                <div class="gc-svc-row{{ if not $run }} gc-svc-off{{ end }}">
                  <div class="gc-svc-name">
                    <span class="gc-dot {{ if and $run (ne (.String "health") "unhealthy") }}gc-dot-ok{{ else }}gc-dot-bad{{ end }}"></span>
                    <div>
                      <div class="gc-svc-title">{{ .String "display_name" }}</div>
                      <div class="gc-svc-sub">{{ .String "status" }}</div>
                    </div>
                  </div>
                  {{ if $run }}
                  <div class="gc-svc-metric">
                    <div class="gc-svc-label"><span>CPU</span><b>{{ printf "%.1f" (.Float "cpu_percent") }}%</b></div>
                    <div class="gc-svc-bar"><div style="width: {{ printf "%.1f" (.Float "cpu_bar") }}%"></div></div>
                  </div>
                  <div class="gc-svc-metric gc-svc-mem">
                    <div class="gc-svc-label"><span>RAM</span><b>{{ formatBytes (.Int "memory_bytes") }}</b></div>
                    <div class="gc-svc-bar"><div style="width: {{ printf "%.1f" (.Float "memory_bar") }}%"></div></div>
                  </div>
                  {{ else }}
                  <div class="gc-svc-stopped">Stopped</div>
                  {{ end }}
                </div>
                {{ end }}
              </div>
