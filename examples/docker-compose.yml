# Goodiecat. The installer (install.sh) sets this up for you; to do it by hand,
# put goodiecat.yml in ./config, create .env with
#   GOODIECAT_APP_TOKEN=<any long random text>
#   GOODIECAT_PORT=8080
# and run `docker compose up -d`.
services:
  goodiecat:
    image: ghcr.io/goodborn/goodiecat:latest
    restart: unless-stopped
    ports:
      - "${GOODIECAT_PORT:-8080}:8080"
    env_file: .env
    environment:
      # lets the server card show your computer's name and drives
      - HOST_ETC=/host/etc
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      # container status, and start / stop / restart from the app
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
